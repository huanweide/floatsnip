name: CI
on:
  push:
  pull_request:
  workflow_dispatch:      # 支持手动重跑，便于修复后立即验证
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: "Run logic tests (Windows-only: main.py uses ctypes.windll)"
        run: pytest -q
