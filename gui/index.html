<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FloatSnip 浮球快贴</title>
<style>
  :root{
    --bg:#0f1117; --panel:rgba(22,24,33,.82); --card:rgba(255,255,255,.05);
    --card-hover:rgba(124,108,255,.14); --line:rgba(255,255,255,.08);
    --txt:#e8eaf2; --sub:#9aa0b4; --acc1:#7c6cff; --acc2:#a06bff;
    --ok:#39d98a; --danger:#ff6b81; --radius:16px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;}
  html,body{width:100%;height:100%;background:transparent;font-family:var(--font);color:var(--txt);overflow:hidden;}
  body{position:relative;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  textarea{font-family:inherit;}

  /* ============ 球 ============ */
  #ball{
    position:absolute;left:50%;top:50%;width:64px;height:64px;transform:translate(-50%,-50%) scale(1);
    border-radius:50%;background:linear-gradient(135deg,var(--acc1),var(--acc2));
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 8px 30px rgba(124,108,255,.55),0 0 0 6px rgba(124,108,255,.12);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  #ball:hover{transform:translate(-50%,-50%) scale(1.08);}
  #ball svg{width:30px;height:30px;fill:#fff;}
  #ball .pulse{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 rgba(124,108,255,.5);animation:pulse 2.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,108,255,.45);}70%{box-shadow:0 0 0 16px rgba(124,108,255,0);}100%{box-shadow:0 0 0 0 rgba(124,108,255,0);}}

  /* ============ 面板 ============ */
  #panel{
    position:absolute;inset:0;display:flex;flex-direction:column;
    background:var(--panel);backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    opacity:0;transform:scale(.92);pointer-events:none;transition:opacity .22s ease,transform .22s ease;
  }
  body.mode-panel #panel{opacity:1;transform:scale(1);pointer-events:auto;}
  body.mode-panel #ball{opacity:0;transform:translate(-50%,-50%) scale(.4);pointer-events:none;}

  .titlebar{display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;background:linear-gradient(135deg,rgba(124,108,255,.22),rgba(160,107,255,.10));
    border-bottom:1px solid var(--line);cursor:grab;}
  .titlebar:active{cursor:grabbing;}
  .logo{font-weight:700;font-size:14px;letter-spacing:.3px;display:flex;align-items:center;gap:6px;}
  .logo .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--acc1),var(--acc2));box-shadow:0 0 10px var(--acc2);}
  .title-actions{display:flex;gap:6px;}
  .icon-btn{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.06);color:var(--sub);
    font-size:14px;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .icon-btn:hover{background:rgba(255,255,255,.14);color:var(--txt);}

  /* 分类标签 */
  .cats{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);}
  .cats::-webkit-scrollbar{display:none;}
  .cat{padding:6px 14px;border-radius:999px;background:var(--card);color:var(--sub);font-size:13px;white-space:nowrap;transition:.15s;border:1px solid transparent;}
  .cat:hover{color:var(--txt);}
  .cat.active{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(124,108,255,.4);}

  /* 列表 */
  .list{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:9px;}
  .list::-webkit-scrollbar{width:6px;}
  .list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px;}
  .item{position:relative;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 44px 12px 13px;
    font-size:13.5px;line-height:1.5;cursor:pointer;transition:transform .12s ease,background .15s ease,box-shadow .15s ease;
    animation:rise .25s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .item:hover{background:var(--card-hover);transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.28);}
  .item .txt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .item .ops{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:.15s;}
  .item:hover .ops{opacity:1;}
  .op{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.08);color:var(--sub);font-size:12px;display:flex;align-items:center;justify-content:center;}
  .op:hover{background:rgba(255,255,255,.18);color:var(--txt);}
  .op.del:hover{background:rgba(255,107,129,.2);color:var(--danger);}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:40px 16px;line-height:1.7;}

  .add-btn{margin:0 12px 12px;padding:12px;border-radius:13px;background:linear-gradient(135deg,var(--acc1),var(--acc2));
    color:#fff;font-size:14px;font-weight:600;box-shadow:0 6px 18px rgba(124,108,255,.4);transition:.15s;}
  .add-btn:hover{filter:brightness(1.08);transform:translateY(-1px);}

  /* 弹窗 */
  .modal{position:absolute;inset:0;background:rgba(6,8,14,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:.18s ease;z-index:20;padding:18px;}
  .modal.show{opacity:1;pointer-events:auto;}
  .modal-card{width:100%;max-width:320px;background:#161922;border:1px solid var(--line);border-radius:16px;padding:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(.94);transition:.18s ease;}
  .modal.show .modal-card{transform:scale(1);}
  .modal-card h3{font-size:15px;margin-bottom:12px;}
  textarea#editorText{width:100%;height:130px;resize:none;background:var(--card);border:1px solid var(--line);border-radius:11px;
    color:var(--txt);padding:11px;font-size:13.5px;line-height:1.5;outline:none;-webkit-user-select:text;user-select:text;}
  textarea#editorText:focus{border-color:var(--acc1);}
  .cat-pick{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0;}
  .cat-pick .cp{padding:5px 12px;border-radius:999px;background:var(--card);color:var(--sub);font-size:12.5px;border:1px solid transparent;}
  .cat-pick .cp.active{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;}
  .modal-actions{display:flex;gap:9px;margin-top:6px;}
  .btn{flex:1;padding:10px;border-radius:11px;font-size:13.5px;font-weight:600;transition:.15s;}
  .btn.primary{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.ghost{background:var(--card);color:var(--sub);}
  .btn.ghost:hover{color:var(--txt);}
  .btn.danger{background:rgba(255,107,129,.16);color:var(--danger);}
  .btn.danger:hover{background:rgba(255,107,129,.26);}

  .switch-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:13.5px;border-bottom:1px solid var(--line);}
  .switch-row input{width:18px;height:18px;accent-color:var(--acc1);}
  .cat-edit{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
  .cat-edit .ce{display:flex;align-items:center;gap:8px;}
  .cat-edit .ce label{width:54px;font-size:12px;color:var(--sub);}
  .cat-edit .ce input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:7px 9px;font-size:13px;outline:none;}
  .cat-edit .ce input:focus{border-color:var(--acc1);}
  .cat-edit .note{font-size:11.5px;color:var(--sub);}

  /* Toast */
  .toast{position:absolute;left:50%;bottom:18px;transform:translate(-50%,16px);background:rgba(20,22,30,.95);
    border:1px solid var(--line);color:var(--txt);padding:9px 16px;border-radius:999px;font-size:13px;
    display:flex;align-items:center;gap:7px;opacity:0;pointer-events:none;transition:.22s ease;z-index:30;
    box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .toast .ck{color:var(--ok);font-weight:700;}
  .toast.err .ck{color:var(--danger);}
</style>
</head>
<body class="mode-ball">
  <div id="ball" class="ball draggable" onclick="toggleMode()">
    <span class="pulse"></span>
    <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
  </div>

  <div id="panel">
    <div class="titlebar draggable">
      <span class="logo"><span class="dot"></span>浮球快贴</span>
      <div class="title-actions">
        <button class="icon-btn" onclick="toggleMode()" title="收起">▢</button>
        <button class="icon-btn" onclick="openSettings()" title="设置">⚙</button>
      </div>
    </div>
    <div id="cats" class="cats"></div>
    <div id="list" class="list"></div>
    <button class="add-btn" onclick="openEditor(null)">＋ 新建常用语</button>
  </div>

  <div id="editor" class="modal">
    <div class="modal-card">
      <h3 id="editorTitle">新建常用语</h3>
      <textarea id="editorText" maxlength="10000" placeholder="输入任意内容，支持中文输入法，无上限（软上限 10000 字）。例如：常用话术、账号、命令模板、发弹幕的文案…"></textarea>
      <div id="editorCats" class="cat-pick"></div>
      <div class="modal-actions">
        <button class="btn ghost" onclick="closeEditor()">取消</button>
        <button class="btn primary" onclick="saveEditor()">保存</button>
      </div>
    </div>
  </div>

  <div id="settings" class="modal">
    <div class="modal-card">
      <h3>设置</h3>
      <div class="switch-row"><span>复制后自动粘贴</span><input type="checkbox" id="autoPaste" onchange="toggleAutoPaste(this.checked)"></div>
      <div class="cat-edit" id="catEditor"></div>
      <div class="modal-actions">
        <button class="btn ghost" onclick="closeSettings()">关闭</button>
        <button class="btn danger" onclick="quitApp()">退出</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

<script>
const api = window.pywebview.api;
let state = null;
let currentCat = 'all';
let editId = null;
let editCat = null;

function setMode(m){ document.body.className = 'mode-'+m; }
async function toggleMode(){
  const m = await api.toggle_mode();
  setMode(m);
}
function bindDrag(el){
  if(!el) return;
  el.addEventListener('mousedown', function(ev){
    if(ev.target.closest('button')) return;
    try{ pywebview.window.startDrag(); }catch(e){}
  });
}

async function init(){
  state = await api.get_state();
  setMode(await api.get_mode());
  renderCats(); renderList(); bindDrag(document.querySelector('.titlebar')); bindDrag(document.getElementById('ball'));
}
function cats(){ return state.categories; }
function customs(){ return state.categories.filter(c=>!c.fixed); }

function renderCats(){
  const box = document.getElementById('cats'); box.innerHTML="";
  cats().forEach(c=>{
    const b=document.createElement('div');
    b.className='cat'+(c.id===currentCat?' active':'');
    b.textContent=c.name;
    b.onclick=()=>{ currentCat=c.id; renderCats(); renderList(); };
    box.appendChild(b);
  });
}
function renderList(){
  const box=document.getElementById('list'); box.innerHTML="";
  let items=state.snippets.slice().reverse();
  if(currentCat!=='all') items=items.filter(s=>s.category===currentCat);
  if(items.length===0){
    box.innerHTML='<div class="empty">这里还没有内容<br>点下方「＋ 新建常用语」添加第一条吧</div>';
    return;
  }
  items.forEach((s,i)=>{
    const d=document.createElement('div'); d.className='item'; d.style.animationDelay=(i*0.02)+'s';
    const txt=document.createElement('div'); txt.className='txt'; txt.textContent=s.content;
    const ops=document.createElement('div'); ops.className='ops';
    const e=document.createElement('button'); e.className='op'; e.textContent='✎'; e.title='编辑'; e.onclick=(ev)=>{ev.stopPropagation();openEditor(s.id);};
    const x=document.createElement('button'); x.className='op del'; x.textContent='✕'; x.title='删除'; x.onclick=(ev)=>{ev.stopPropagation();delSnip(s.id);};
    ops.appendChild(e); ops.appendChild(x);
    d.appendChild(txt); d.appendChild(ops);
    d.onclick=()=>doCopy(s.id);
    box.appendChild(d);
  });
}
async function doCopy(sid){
  const ok=await api.copy(sid);
  toast(ok?'复制成功':'复制失败', ok);
}
function toast(msg, ok){
  const t=document.getElementById('toast');
  t.innerHTML='<span class="ck">'+(ok?'✓':'✕')+'</span>'+msg;
  t.className='toast show'+(ok?'':' err');
  setTimeout(()=>{ t.className='toast'+(ok?'':' err'); }, 1400);
}

/* 编辑器 */
function openEditor(sid){
  editId = sid;
  const s = sid ? state.snippets.find(x=>x.id===sid) : null;
  document.getElementById('editorTitle').textContent = sid ? '编辑常用语' : '新建常用语';
  document.getElementById('editorText').value = s ? s.content : '';
  editCat = s ? s.category : (customs()[0]?customs()[0].id:'c1');
  renderEditorCats();
  document.getElementById('editor').classList.add('show');
  setTimeout(()=>document.getElementById('editorText').focus(),120);
}
function renderEditorCats(){
  const box=document.getElementById('editorCats'); box.innerHTML="";
  customs().forEach(c=>{
    const b=document.createElement('div'); b.className='cp'+(c.id===editCat?' active':'');
    b.textContent=c.name; b.onclick=()=>{ editCat=c.id; renderEditorCats(); };
    box.appendChild(b);
  });
}
function closeEditor(){ document.getElementById('editor').classList.remove('show'); editId=null; }
async function saveEditor(){
  const v=document.getElementById('editorText').value;
  if(!v.trim()){ toast('内容不能为空',false); return; }
  const r=await api.save_snippet(editId, v, editCat);
  if(r.ok){ state=r.state; closeEditor(); renderCats(); renderList(); toast('已保存',true); }
  else toast(r.msg||'保存失败',false);
}

async function delSnip(sid){
  const r=await api.delete_snippet(sid);
  if(r.ok){ state=r.state; renderCats(); renderList(); toast('已删除',true); }
}

/* 设置 */
function openSettings(){
  document.getElementById('autoPaste').checked = !!(state.settings&&state.settings.auto_paste);
  renderCatEditor();
  document.getElementById('settings').classList.add('show');
}
function renderCatEditor(){
  const box=document.getElementById('catEditor'); box.innerHTML="";
  customs().forEach(c=>{
    const row=document.createElement('div'); row.className='ce';
    const lab=document.createElement('label'); lab.textContent='分类';
    const inp=document.createElement('input'); inp.value=c.name; inp.maxLength=8;
    inp.onchange=async()=>{ const r=await api.rename_category(c.id, inp.value); if(r.ok){state=r.state;renderCats();} else toast(r.msg||'失败',false); };
    row.appendChild(lab); row.appendChild(inp); box.appendChild(row);
  });
  const note=document.createElement('div'); note.className='note';
  note.textContent='「所有」为固定全集，不可改名；自定义分类最多 5 个。';
  box.appendChild(note);
}
function closeSettings(){ document.getElementById('settings').classList.remove('show'); }
async function toggleAutoPaste(v){ const r=await api.set_auto_paste(v); state.settings=r; toast(r.auto_paste?'已开启自动粘贴':'已关闭自动粘贴',true); }
function quitApp(){ try{ api.quit_app(); }catch(e){} }

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeEditor(); closeSettings(); } });

init();
</script>
</body>
</html>
